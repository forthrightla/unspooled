[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unspooled-processor"
version = "0.1.0"
description = "Unspooled: Personal music listening analytics pipeline (Spotify, Last.fm, Apple Music, MusicBrainz)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Josh", email = "josh@example.com" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.4.2",
  "python-dateutil>=2.9.0",
  "rich>=13.7.0",
  "python-slugify>=8.0.1",
  "typer>=0.12.5",
  "rapidfuzz>=3.5.2",
  "Unidecode>=1.3.7",
  "phonetics>=1.0.5",
  "PyYAML>=6.0.1",
  "musicbrainzngs>=0.7.1",
  "certifi>=2023.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6.0",
]

[project.urls]
homepage = "https://github.com/josh/unspooled"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
dev-dependencies = [
  "pytest>=7.4",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.typer]
color = true
